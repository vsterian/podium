name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main, feat/multi-cli-support]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test (server, frontend, simulator, podiumctl)
        run: npm test

      - name: Build (UI, server, scripts type-check)
        run: npm run build

# Not run here: `npm run test:mod` and `npm run typecheck:mod` need the Claude Code CLI and its plugin API
# declarations, which a stock runner does not have. Run them locally when the mod changes (CONTRIBUTING.md).
